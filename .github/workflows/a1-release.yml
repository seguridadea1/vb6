# Publica nuestra compilacion de aspen para que la consuman los puestos de
# desarrollo. Es una variacion del `Aspen Release` de upstream: mismo build,
# distinto destino y con checksums, que es lo que el instalador verifica.
#
# Se dispara con etiquetas `a1-v*` sobre la rama A1.
#
# Publica en las Releases de ESTE repositorio con el GITHUB_TOKEN del propio
# workflow: el `permissions: contents: write` de abajo es todo lo que hace
# falta, sin variables ni secretos.
#
# Lo unico que hay que saber: este fork es PUBLICO, asi que sus releases
# tambien lo son. Si algun dia el binario tiene que ser privado habra que
# publicarlo en otro repositorio, y eso si exige un PAT, porque el
# GITHUB_TOKEN solo tiene permisos aqui.
name: A1 Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'a1-v*'

jobs:
  # La suite corre en LINUX a proposito, aunque el binario se compile en
  # Windows. Los snapshots de `test-data` se generaron desde blobs con LF, y en
  # Windows esos ficheros se materializan como CRLF -- los submodulos traen su
  # propio .gitattributes, asi que `core.autocrlf=false` no basta para
  # evitarlo. En Linux coinciden y la comparacion mide lo que debe medir: el
  # parser, no el checkout.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test workspace
        run: cargo test --workspace --locked

  build-windows:
    # TEMPORAL, y a peticion expresa: el empaquetado NO espera a la suite.
    #
    # Falla un unico test, `environment_textp0_form_load`, y es consecuencia
    # esperada de aceptar letras no ASCII en los identificadores: ese formulario
    # tiene uno, ahora se tokeniza como un solo token y su snapshot cambio. Hay
    # que regenerarlo con los ficheros en LF -- generarlo desde un checkout
    # Windows metería CRLF dentro y volveria a romper el job de Linux.
    #
    # El job `test` sigue ejecutandose para no perder la señal: se ve en rojo en
    # la pestaña de Actions aunque la release salga. Al regenerar el snapshot,
    # devolver el `needs: test` de una linea.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        run: choco install wixtoolset -y

      - name: Build Aspen
        run: cargo build --release -p aspen

      - name: Package Windows artifact
        shell: bash
        run: |
          python3 scripts/package_aspen_windows.py \
            --binary target/release/aspen.exe \
            --output dist/aspen-windows

      - name: Create Windows release archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/aspen-windows/* -DestinationPath dist/aspen-windows.zip -Force

      - name: Build MSI installer
        shell: bash
        run: |
          python3 scripts/build_aspen_msi.py --output dist/aspen-windows.msi

      # El instalador comprueba el checksum antes de usar el binario, asi que
      # el fichero se genera aqui y viaja con la release.
      - name: Generate checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum --text aspen-windows.zip aspen-windows.msi > checksums.txt
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/aspen-windows.zip
            dist/aspen-windows.msi
            dist/checksums.txt
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
